[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchsim"
license = "MIT"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "pybaseball>=2.2.7", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest"]
mcp = ["mcp>=2"]
video = ["rtmlib", "onnxruntime", "opencv-python"]
seq = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
