<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pitch Park mark: a ball in flight (gold speed lines) on the app's dark ground. Colours from src/ui.css. -->
  <rect width="64" height="64" rx="14" fill="#0b0f14"/>
  <g stroke="#f2c14e" stroke-width="3.5" stroke-linecap="round">
    <path d="M7 24h9"/><path d="M4 32h11"/><path d="M8 40h8"/>
  </g>
  <clipPath id="b"><circle cx="38" cy="32" r="18"/></clipPath>
  <circle cx="38" cy="32" r="18" fill="#fff"/>
  <g clip-path="url(#b)" fill="none" stroke="#e05a4f" stroke-width="2.6" stroke-linecap="round">
    <path d="M26 15q8 17 0 34"/><path d="M50 15q-8 17 0 34"/>
  </g>
</svg>
